# Exporte le preset "Web" (démo publique — biome 1 solo, Pikachu, cf.
# autoloads/DemoBoot.gd) et publie le résultat dans docs/demo/, servi par
# GitHub Pages. Déclenchement manuel uniquement : à relancer après un
# changement de gameplay qui doit se refléter dans la démo.
name: Build demo web

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # cf. commentaire sur l'étape d'import : un import à froid peut être long
    steps:
      - uses: actions/checkout@v4

      - name: Bibliothèques système
        # Même piège que le build Linux du workflow Release : le binaire
        # Godot headless est lié à X11/ALSA même sans écran.
        run: |
          sudo apt-get update -qq
          for pkg in libfontconfig1 libxcursor1 libxinerama1 libxi6 libxrandr2 \
                     libxrender1 libxext6 libgl1 libasound2t64 libpulse0; do
            sudo apt-get install -y --no-install-recommends "$pkg" \
              || echo "::warning::paquet non installé : $pkg"
          done

      - name: Installer Godot + templates d'export
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o tpl.tpz   "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          unzip -q tpl.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          ./godot --version

      - name: Importer les ressources
        # .godot/ est gitignoré : chaque run CI part d'un cache d'import
        # totalement VIDE, contrairement à un poste de dev où l'import est
        # déjà fait depuis longtemps. Sur un projet de cette taille (dump
        # Pokemon Essentials, packs Kenney...), un import à froid peut
        # largement dépasser les 900s d'origine — qui échouaient
        # silencieusement (`|| true`), livrant un .pck sans AUCUNE ressource
        # importée (0 fichier .import, 0 entrée .godot/imported/ dedans,
        # vérifié en inspectant le .pck livré) : tout ce qui est chargé
        # dynamiquement par chemin (berrytree, grass.png, les .glb Kenney...)
        # plantait au premier load() avec "No loader found for resource".
        # Le code de sortie de Godot reste peu fiable ici (`|| true`
        # conservé), donc on vérifie directement le symptôme diagnostiqué :
        # un .godot/imported/ quasi vide = import resté incomplet.
        run: |
          timeout 2700 ./godot --headless --import . || true
          count=$(find .godot/imported -type f 2>/dev/null | wc -l)
          echo "Ressources importées : $count"
          if [ "$count" -lt 500 ]; then
            echo "::error::Import quasi vide ($count fichiers) — timeout trop court ou échec silencieux."
            exit 1
          fi

      - name: Exporter la démo web
        run: |
          mkdir -p builds/web
          timeout 900 ./godot --headless --export-release "Web" builds/web/index.html
          test -f builds/web/index.html
          ls -lh builds/web

      - uses: actions/upload-artifact@v4
        with:
          name: demo-web
          path: builds/web/

      - name: Publier dans docs/demo/
        run: |
          rm -rf docs/demo
          mkdir -p docs/demo
          cp -r builds/web/* docs/demo/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/demo
          if git diff --cached --quiet; then
            echo "Aucun changement dans le build web, rien à committer."
          else
            git commit -m "chore(demo): mise à jour du build web"
            git pull --rebase origin main
            git push
          fi
