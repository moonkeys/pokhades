# Publie une nouvelle version : export Godot -> paquet Velopack -> GitHub Release,
# pour Windows et macOS.
# Déclenché en poussant un tag :  git tag v1.0.0 && git push origin v1.0.0
# (déclenchement manuel possible depuis l'onglet Actions, sans publier de release)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Le contexte env n'est pas accessible depuis strategy.matrix (erreur
  # "Unrecognized named-value: env" à la compilation du workflow) : la même
  # valeur est donc aussi codée en dur dans templates_dir pour chaque
  # entrée de la matrice ci-dessous. Les deux doivent rester synchronisés.
  GODOT_VERSION: "4.7"   # doit correspondre aux templates d'export du projet
  APP_ID: Pokhades

jobs:
  build:
    # Velopack packe pour la plateforme du runner qui l'exécute (pas celle du
    # binaire fourni) : un mainExe Windows packagé sur ubuntu-latest fait
    # planter vpk, qui tente d'y lire un ELF Linux. Chaque plateforme tourne
    # donc sur son propre runner natif.
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: win
            os: windows-latest
            preset: "Windows Desktop"
            export_path: builds/windows/Pokhades.exe
            pack_dir: builds/windows
            main_exe: Pokhades.exe
            godot_asset: win64.exe.zip
            godot_asset_bin: win64.exe
            templates_dir: "$APPDATA/Godot/export_templates/4.7.stable"

          - channel: osx
            os: macos-latest
            preset: "macOS"
            export_path: builds/macos/Pokhades.zip
            pack_dir: builds/macos/flat
            main_exe: Pokhades
            godot_asset: macos.universal.zip
            godot_asset_bin: ""   # cas particulier : bundle Godot.app, pas un binaire nu
            templates_dir: "$HOME/Library/Application Support/Godot/export_templates/4.7.stable"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60   # garde-fou : un export bloqué ne tourne pas indéfiniment (import à froid inclus)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Installer Godot + templates d'export
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_${{ matrix.godot_asset }}"
          curl -fsSL -o tpl.tpz   "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mkdir -p "$RUNNER_TEMP/godot-bin"

          if [ "${{ matrix.channel }}" = "osx" ]; then
            mv Godot.app "$RUNNER_TEMP/godot-bin/Godot.app"
            GODOT_BIN="$RUNNER_TEMP/godot-bin/Godot.app/Contents/MacOS/Godot"
          else
            mv "Godot_v${GODOT_VERSION}-stable_${{ matrix.godot_asset_bin }}" "$RUNNER_TEMP/godot-bin/godot$( [ '${{ matrix.channel }}' = 'win' ] && echo .exe )"
            GODOT_BIN="$RUNNER_TEMP/godot-bin/godot$( [ '${{ matrix.channel }}' = 'win' ] && echo .exe )"
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          unzip -q tpl.tpz
          # Le dossier attendu porte la version telle que rapportée par l'éditeur
          mkdir -p "${{ matrix.templates_dir }}"
          mv templates/* "${{ matrix.templates_dir }}/"
          "$GODOT_BIN" --version

      - name: Importer les ressources
        # .godot/ est gitignoré : chaque run CI part d'un cache d'import
        # totalement VIDE (contrairement à un poste de dev où il est déjà
        # là). Sur un projet de cette taille (dump Pokemon Essentials, packs
        # Kenney...), un import à froid peut dépasser largement les 900s
        # d'origine — qui échouaient silencieusement (`|| true`), livrant un
        # export sans AUCUNE ressource importée : tout ce qui est chargé
        # dynamiquement par chemin (berrytree, grass.png, les .glb Kenney...)
        # plante au premier load() avec "No loader found for resource".
        # Découvert sur l'export Web (inspection du .pck livré : 0 fichier
        # .import, 0 entrée .godot/imported/ dedans) — même mécanisme ici,
        # `timeout` étant absent de macOS on garde le fallback existant.
        # Le code de sortie de Godot reste peu fiable (`|| true` conservé),
        # donc on vérifie directement le symptôme diagnostiqué : un
        # .godot/imported/ quasi vide = import resté incomplet.
        run: |
          if command -v timeout >/dev/null 2>&1; then
            timeout 2700 "$GODOT_BIN" --headless --import . || true
          else
            "$GODOT_BIN" --headless --import . || true
          fi
          count=$(find .godot/imported -type f 2>/dev/null | wc -l)
          echo "Ressources importées : $count"
          if [ "$count" -lt 500 ]; then
            echo "::error::Import quasi vide ($count fichiers) — timeout trop court ou échec silencieux."
            exit 1
          fi

      - name: Exporter le jeu (${{ matrix.channel }})
        run: |
          mkdir -p "$(dirname "${{ matrix.export_path }}")"
          if command -v timeout >/dev/null 2>&1; then
            timeout 900 "$GODOT_BIN" --headless --export-release "${{ matrix.preset }}" "${{ matrix.export_path }}"
          else
            "$GODOT_BIN" --headless --export-release "${{ matrix.preset }}" "${{ matrix.export_path }}"
          fi
          test -e "${{ matrix.export_path }}"   # échoue franchement si l'export n'a rien produit
          ls -lh "$(dirname "${{ matrix.export_path }}")"

      - name: Préparer le dossier à packager
        run: |
          if [ "${{ matrix.channel }}" = "osx" ]; then
            # L'export produit un .zip contenant Pokhades.app. Contrairement à
            # ce qu'indiquait le message d'erreur de vpk ("Could not find main
            # application executable ... Pokhades.app"), --packDir n'attend
            # PAS un bundle .app déjà assemblé : vpk construit lui-même le
            # bundle à partir d'un dossier À PLAT (exécutable + ressources au
            # même niveau, comme pour Windows) et --mainExe est le nom du
            # binaire, pas du bundle. Confirmé en reproduisant l'appel exact
            # en local (dotnet installé via Homebrew) : la version "bundle
            # pré-assemblé" échoue systématiquement, la version aplatie
            # produit un .pkg en 11s.
            mkdir -p unzipped_app "${{ matrix.pack_dir }}"
            unzip -q "${{ matrix.export_path }}" -d unzipped_app
            cp -r unzipped_app/Pokhades.app/Contents/MacOS/*   "${{ matrix.pack_dir }}/"
            cp -r unzipped_app/Pokhades.app/Contents/Resources/* "${{ matrix.pack_dir }}/"
            echo "--- contenu de ${{ matrix.pack_dir }} ---"
            ls -la "${{ matrix.pack_dir }}"
            test -f "${{ matrix.pack_dir }}/${{ matrix.main_exe }}"
          fi

      - name: Installer le runtime .NET
        # vpk 1.2.0 cible .NET 10 ; les runners ne fournissent pas tous un
        # SDK compatible pour chaque architecture par défaut (constaté sur
        # macos-latest arm64 : "You must install .NET to run this
        # application", DOTNET_ROOT introuvable).
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Installer Velopack
        run: dotnet tool install -g vpk

      - name: Packager (installeur + delta vs version précédente)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="0.0.$GITHUB_RUN_NUMBER"   # run manuel, hors tag
          mkdir -p releases
          # Récupère les paquets précédents de CE canal pour que Velopack calcule un delta
          # (nom tel que renommé par l'étape "Renommer les paquets" d'un run antérieur).
          # UNIQUEMENT sur un vrai tag : gh release download sans tag précis
          # cible la DERNIÈRE release publiée, dont la version réelle (ex.
          # 0.1.6) dépasse presque toujours le "0.0.$RUN_NUMBER" arbitraire
          # d'un run manuel — vpk refuse alors de packager une version plus
          # ancienne que ce qu'il trouve ("There is a release ... equal or
          # greater to the current version"). Un run manuel n'a de toute
          # façon aucune raison de calculer un delta contre du réel.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release download --pattern "${{ matrix.channel }}-*.nupkg" --dir releases || true
          fi
          vpk pack \
            --packId "$APP_ID" \
            --packVersion "$VERSION" \
            --packDir "${{ matrix.pack_dir }}" \
            --mainExe "${{ matrix.main_exe }}" \
            --channel "${{ matrix.channel }}" \
            --outputDir releases
          ls -lh releases
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Renommer les paquets (nom attendu par la page + éviter les collisions inter-canaux)
        # Velopack ne préfixe pas tout par le canal : "RELEASES" et
        # "*-full.nupkg" ont le même nom sur les trois plateformes. Comme les
        # trois jobs finissent fusionnés dans un seul dossier avant l'upload
        # vers la Release, ces fichiers s'écraseraient silencieusement.
        # Sous `set -e -o pipefail` (le mode par défaut des steps GitHub
        # Actions), "ls motif-sans-résultat | head" peut faire échouer tout
        # le script même quand head réussit : pipefail propage l'échec de
        # ls. On protège donc chaque recherche avec `|| true` / `shopt -s
        # nullglob` plutôt que de compter sur le pipe.
        run: |
          shopt -s nullglob

          if [ "${{ matrix.channel }}" = "win" ]; then
            ext="exe"; dest="Pokhades-win-Setup.exe"
          else
            ext="pkg"; dest="Pokhades-osx-Setup.pkg"
          fi

          matches=(releases/*."$ext")
          if [ "${#matches[@]}" -gt 0 ]; then
            # vpk --channel produit parfois déjà le nom exact attendu
            # (ex. Windows : Pokhades-win-Setup.exe) : ne pas copier un
            # fichier sur lui-même.
            if [ "$(basename "${matches[0]}")" != "$dest" ]; then
              cp "${matches[0]}" "releases/$dest"
            fi
          else
            echo "::warning::Aucun .$ext produit par vpk pour le canal ${{ matrix.channel }} — vérifie le contenu de releases/"
          fi

          if [ -f releases/RELEASES ]; then
            mv releases/RELEASES "releases/RELEASES-${{ matrix.channel }}"
          fi
          for f in releases/*-full.nupkg releases/*-delta.nupkg; do
            base=$(basename "$f")
            mv "$f" "releases/${{ matrix.channel }}-${base#"${APP_ID}"-}"
          done
          ls -lh releases

      - uses: actions/upload-artifact@v4
        with:
          name: pokhades-${{ matrix.channel }}
          path: releases/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `gh release create --generate-notes` a besoin de l'historique git
      # (comparer avec le tag précédent) — sans checkout : "fatal: not a
      # git repository".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tout l'historique, pas juste le tag courant : --generate-notes doit voir le tag précédent

      - uses: actions/download-artifact@v4
        with:
          pattern: pokhades-*
          path: releases
          merge-multiple: true

      - run: ls -lh releases

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" releases/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Conserver les paquets (run manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: pokhades-packages
          path: releases/
